[project]
name = "slim-sheet"
version = "0.1.0"
description = "Universal, token-frugal spreadsheet MCP server and CLI for any agent, from local 7B models to frontier models."
readme = "README.md"
authors = [
    { name = "j4flmao", email = "j4flmao@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
license-files = ["LICENSE"]
keywords = ["mcp", "excel", "xlsx", "spreadsheet", "duckdb", "llm", "agent", "ollama", "lm-studio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.3",
    "mcp>=2.3",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "pyarrow>=17",
    "python-calamine>=0.4",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/j4flmao/slim-sheet"
Repository = "https://github.com/j4flmao/slim-sheet"
Issues = "https://github.com/j4flmao/slim-sheet/issues"
Changelog = "https://github.com/j4flmao/slim-sheet/blob/main/CHANGELOG.md"

[project.scripts]
slim-sheet = "slim_sheet.interfaces.cli:main"

[project.optional-dependencies]
formula = [
    "formulas>=1.2",
]
crypto = [
    "msoffcrypto-tool>=5.4",
]
numbers = [
    "numbers-parser>=4.10",
]
all = [
    "slim-sheet[formula,crypto,numbers,images]",
]
images = [
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "PLAN.md", "AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/slim_sheet"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
eval = [
    "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/slim_sheet/interfaces/cli.py" = ["T20"]
"src/slim_sheet/core/functions.py" = ["E501"]  # catalog data rows

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["python_calamine.*", "openpyxl.*", "pyarrow.*", "formulas.*", "schedula.*", "numbers_parser.*", "msoffcrypto.*", "olefile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-ra"
filterwarnings = ["ignore:.*with .* literal:SyntaxWarning"]  # third-party `formulas` source
