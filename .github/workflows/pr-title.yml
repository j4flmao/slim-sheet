# PR titles become squash-merge commit messages, so they follow the same Conventional Commits rule
# as scripts/check_commit_msg.py.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            build
            ci
            revert
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: Subject must start lowercase and not end with a period.
