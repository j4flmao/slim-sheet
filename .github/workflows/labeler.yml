name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with the base branch's code; labeler only reads the diff, never PR code.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
