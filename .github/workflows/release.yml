# Release on a version tag (v0.1.0): build, attest the build provenance and publish an SPDX SBOM,
# publish to PyPI with the PYPI_API_TOKEN repository secret, then publish server.json to the MCP
# Registry with GitHub OIDC.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # build provenance attestation
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: PyPI token must be set
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$PYPI_API_TOKEN" || {
            echo "::error::Add the PYPI_API_TOKEN repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          }
      - name: Tag must match pyproject version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - run: uv run python scripts/build_manifests.py --check
      - run: uv build
      - name: Build provenance for the wheel and sdist
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: SBOM (SPDX) of the locked dependencies
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: slim-sheet.spdx.json
      - name: Attach SBOM and dists to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* slim-sheet.spdx.json --generate-notes
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false  # PEP 740 attestations need trusted publishing, not a token

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
